# Cloudflare configuration for this Worker.
#
# Cloudflare has been consolidating "Pages" into a single Workers +
# Static Assets model, and this config targets that current model:
# `main` is the Worker's code entry point, and [assets] tells it which
# folder to serve as the static site. Deploy with `npx wrangler deploy`.
name = "portfolio"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI binding — lets src/ask-handler.js call env.AI.run(...).
# If this doesn't attach automatically on deploy, add it manually in
# the dashboard instead: Worker -> Settings -> Bindings -> Add ->
# Workers AI -> variable name "AI". See README.md.
[ai]
binding = "AI"

# Workers KV binding — temporary storage for an in-progress chat
# conversation (see src/session.js). REQUIRED for multi-turn chat memory
# to work; without it the chat still answers questions, it just won't
# remember earlier turns in the same conversation.
#
# You must create this namespace yourself (it's account-specific, so
# there's no valid id to ship in this file):
#   npx wrangler kv namespace create CHAT_SESSIONS
# then paste the "id" it prints into the line below. See README.md.
[[kv_namespaces]]
binding = "CHAT_SESSIONS"
id = "76c6a6b44f7c4e7d851a46d5dacb29de"

# Cron Trigger — runs src/scheduled.js every 2 minutes to find chat
# conversations and click-only visits that have gone quiet, send a
# Telegram report, and delete the stored data. See src/scheduled.js for
# the two different inactivity windows it uses (chat conversations wait
# longer than plain browsing) and why neither can be "the exact moment
# they closed the tab" in an architecture with no JavaScript to signal
# that moment directly.
[triggers]
crons = ["*/2 * * * *"]

# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are NOT set here on purpose —
# secrets shouldn't live in a checked-in config file. Set them as
# encrypted variables in the dashboard, or with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
# See README.md for the full walkthrough.
